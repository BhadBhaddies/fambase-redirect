    <section class="timer" aria-label="Redirect countdown">
      <div class="label">🐝 Opening Fambase in...</div>
      <div class="count" id="count">00:10</div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <a class="go" id="continue-button" href="#">Continue to Fambase Now →</a>
      <div class="note" id="countdown-note">Automatically redirecting after 10 seconds</div>
    </section>
  </main>

  <script>
    // Both the button and automatic redirect use FAMBASE_LINK above.
    const button = document.getElementById("continue-button");
    const count = document.getElementById("count");
    const fill = document.getElementById("fill");
    const note = document.getElementById("countdown-note");
    button.href = FAMBASE_LINK;
    note.textContent = `Automatically redirecting after ${COUNTDOWN_SECONDS} seconds`;

    const duration = COUNTDOWN_SECONDS * 1000;
    const start = performance.now();
    let redirected = false;

    function tick(now) {
      const elapsed = Math.min(duration, now - start);
      const remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));
      count.textContent = "00:" + String(remaining).padStart(2, "0");
      fill.style.width = (elapsed / duration * 100) + "%";

      if (elapsed >= duration) {
        if (!redirected) {
          redirected = true;
          window.location.replace(FAMBASE_LINK);
        }
      } else {
        requestAnimationFrame(tick);
      }
    }

    requestAnimationFrame(tick);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !redirected && performance.now() - start >= duration) {
        redirected = true;
        window.location.replace(FAMBASE_LINK);
      }
    });
  </script>
